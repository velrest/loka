  <path d="M272,320 L290,308 L296,326 Z" fill="#6a4c36" opacity="0.6"/>

  <!-- Crack lines -->
  <path d="M200,127 L196,158 L204,178 L196,210 L202,242 L196,268" stroke="#5a3e28" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M202,178 L218,190 L212,206" stroke="#5a3e28" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Pot rim -->
  <ellipse cx="200" cy="118" rx="50" ry="16" fill="#8a6848"/>
  <ellipse cx="200" cy="116" rx="42" ry="11" fill="#3a2818"/>

  <!-- Rim crack -->
