  <!-- Pot body (with gap for broken chunk) -->
  <path d="
    M148,302
    Q118,258 122,198
    Q126,148 162,126
    Q180,117 200,116
    Q220,117 238,126
    Q252,134 260,152
    L244,162
    Q236,142 220,133
    Q210,127 200,127
    Q190,127 178,133
    Q148,149 144,198
    Q140,254 168,296
    Z
  " fill="#7a5c42"/>

  <!-- Pot body right side (connected) -->
  <path d="
    M244,162
    Q274,178 278,198
    Q282,258 252,302
    L148,302
    Q168,296 144,198
    Q148,149 178,133
    Q190,127 200,127
    Q210,127 220,133
    Q236,142 244,162
    Z
  " fill="#7a5c42"/>

  <!-- Broken chunk (missing piece outline) -->
  <path d="M244,162 L268,128 L292,164 L260,152 Z" fill="#1e1b18"/>
  <path d="M244,162 L268,128 L292,164 L260,152 Z" fill="none" stroke="#9a7458" stroke-width="2" stroke-dasharray="4,3"/>

