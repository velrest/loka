# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    
    services:
      postgres:
        image:  postgres:16
        env:
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_DB: "orangerie"
      POSTGRES_HOST: "localhost"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_PORT: 5432
      MIX_ENV: "test"
      MIX_OS_DEPS_COMPILE_PARTITION_COUNT: 4

    steps:
    - uses: actions/checkout@v4

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      id: beam
      with:
        version-file: .tool-versions
        version-type: strict

    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v4
      env:
        cache-name: cache-elixir-deps
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-

    - name: Cache compiled build
      id: cache-build
      uses: actions/cache@v4
      env:
        cache-name: cache-compiled-build
      with:
        path: _build
        key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.cache-name }}-
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile app
      run: mix compile --warnings-as-errors
      env:
        MIX_ENV: ${{ env.MIX_ENV }}

    - name: Check ash codegen
      run: mix ash.codegen --check

    - name: Run lint
      run: mix format --check-formatted

    - name: Run credo
      run: mix credo

    - name: Migrate DB
      run: mix ash.setup

    # Browser tests (test/loka_web/browser) need Node, Playwright's Chromium
    # and the esbuild/tailwind binaries to build the JS under test
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .tool-versions

    - name: Install JS dependencies
      run: |
        corepack enable pnpm
        pnpm --dir assets install --frozen-lockfile

    - name: Install Playwright browser
      run: pnpm --dir assets exec playwright install chromium --with-deps

    - name: Install asset build tools
      run: mix assets.setup

    - name: Run tests
      run: mix test
