services:
  db:
    image: postgres:16
    container_name: loka_db
    environment:
      POSTGRES_DB: loka_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: -p ${DATABASE_PORT:-5433}
    ports:
      - 5433:5433
    volumes:
      - loka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: loka_garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - 3900:3900 # S3 API
      - 3901:3901 # RPC
      - 3902:3902 # Web
      - 3903:3903 # Admin API
    restart: unless-stopped

  garage-init:
    image: dxflrs/garage:v1.0.1
    depends_on:
      - garage
    restart: on-failure
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./garage_entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh

volumes:
  loka_pgdata:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local
