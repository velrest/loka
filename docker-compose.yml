services:
  db:
    image: postgres:16
    container_name: loka_db
    environment:
      POSTGRES_DB: loka_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: -p ${DATABASE_PORT:-5433}
    ports:
      - 5433:5433
    volumes:
      - loka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
    command: server data --console-address :9001
    restart: unless-stopped

  mc:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./mc_entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /entrypoint.sh

volumes:
  loka_pgdata:
    driver: local
  minio_data:
    driver: local
