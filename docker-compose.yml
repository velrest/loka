services:
  db:
    image: postgres:16
    container_name: loka_db
    environment:
      POSTGRES_DB: loka_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: -p ${DATABASE_PORT:-5433}
    ports:
      - 5433:5433
    volumes:
      - loka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p ${DATABASE_PORT:-5433}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  loka_pgdata:
    driver: local
